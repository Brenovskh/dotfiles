# === VÍDEO (AMD + Wayland) ===
vo=gpu
gpu-context=wayland
gpu-api=auto
hwdec=auto-safe
hwdec-codecs=all

# === QUALIDADE DE IMAGEM ===
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
sigmoid-upscaling=yes
correct-downscaling=yes
linear-downscaling=yes

# Debanding
deband=yes
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=32

# === PERFORMANCE ===
video-sync=display-resample
interpolation=yes
tscale=oversample
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB

# === MONITOR / UX ===
fullscreen=yes
keep-open=yes
osc=yes
osd-level=1

# === LEGENDA ===
sub-auto=fuzzy
sub-color='#FFFFFF'
sub-border-size=3
sub-border-color='#000000'
sub-shadow-offset=1
sub-font-size=48
sub-pos=97
sub-font='Noto Sans'

# === ÁUDIO ===
audio-pitch-correction=yes
volume=100

# === REDE ===
ytdl-format=bestvideo+bestaudio/best

# === SHADERS ===
glsl-shaders="~/.config/mpv/shaders/KrigBilateral.glsl:~/.config/mpv/shaders/FSRCNNX_x2_16-0-4-1.glsl:~/.config/mpv/shaders/amd_fsr.glsl"
